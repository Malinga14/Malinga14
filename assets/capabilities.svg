<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-label="02 Capabilities. Frontend: Angular, Next.js, React, TypeScript, Tailwind CSS, Zustand. Backend &amp; AI: Java, Spring Boot, Node.js, Express, MySQL, AI integration. Platforms &amp; Tools: Flutter, Electron, JavaFX, WebGL, Git, Figma"><title>02 Capabilities. Frontend: Angular, Next.js, React, TypeScript, Tailwind CSS, Zustand. Backend &amp; AI: Java, Spring Boot, Node.js, Express, MySQL, AI integration. Platforms &amp; Tools: Flutter, Electron, JavaFX, WebGL, Git, Figma</title><style>
:root{--out:cubic-bezier(0.23,1,0.32,1);--io:cubic-bezier(0.77,0,0.175,1)}
