<svg xmlns="http://www.w3.org/2000/svg" width="840" height="144" viewBox="0 0 840 144" role="img" aria-label="03 Selected work"><title>03 Selected work</title><style>
:root{--out:cubic-bezier(0.23,1,0.32,1);--io:cubic-bezier(0.77,0,0.175,1)}
text{font-family:'Helvetica Neue', Helvetica, Arial, Inter, system-ui, sans-serif;fill:#E6EDF3;font-kerning:normal}
.m{fill:#7D8590}.a{fill:#FF4F2B}
.draw{transform-box:fill-box;transform-origin:left center;animation:draw 1100ms var(--io) both}
.rise{animation:rise 700ms var(--out) both}
.up{animation:up 1000ms var(--out) both}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes up{from{transform:translateY(190px)}}
</style><rect width="840" height="144" fill="#0D1117"/><rect x="32" y="32" width="776" height="1" fill="#30363D"/><text x="32" y="64" font-size="13" font-weight="700" class="a">03</text><text x="98" y="64" font-size="13" font-weight="700">Selected Work</text><text x="808" y="64" font-size="13" font-weight="400" class="m" text-anchor="end">2024 — 2026</text><text x="32" y="128" font-size="12" font-weight="400" class="m">No.</text><text x="98" y="128" font-size="12" font-weight="400" class="m">Project</text><text x="296" y="128" font-size="12" font-weight="400" class="m">Description</text><text x="560" y="128" font-size="12" font-weight="400" class="m">Stack</text><text x="808" y="128" font-size="12" font-weight="400" class="m" text-anchor="end">Year</text><rect x="32" y="143" width="776" height="1" fill="#30363D"/></svg>
