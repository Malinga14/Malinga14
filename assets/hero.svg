<svg xmlns="http://www.w3.org/2000/svg" width="840" height="572" viewBox="0 0 840 572" role="img" aria-label="Malinga Pasindu. Software engineer, Sri Lanka. Building scalable, AI-powered full-stack systems — from enterprise web apps to real-time microservices and mobile."><title>Malinga Pasindu. Software engineer, Sri Lanka. Building scalable, AI-powered full-stack systems — from enterprise web apps to real-time microservices and mobile.</title><style>
