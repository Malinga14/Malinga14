<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-label="01 Profile. I build software that scales quietly and feels considered — clean architecture underneath, a polished experience on top."><title>01 Profile. I build software that scales quietly and feels considered — clean architecture underneath, a polished experience on top.</title><style>
:root{--out:cubic-bezier(0.23,1,0.32,1);--io:cubic-bezier(0.77,0,0.175,1)}
text{font-family:'Helvetica Neue', Helvetica, Arial, Inter, system-ui, sans-serif;fill:#E6EDF3;font-kerning:normal}
.m{fill:#7D8590}.a{fill:#FF4F2B}
.draw{transform-box:fill-box;transform-origin:left center;animation:draw 1100ms var(--io) both}
.rise{animation:rise 700ms var(--out) both}
.up{animation:up 1000ms var(--out) both}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.lift{transform-box:fill-box;animation:lift 900ms var(--out) both}
.nudge{animation:nudge 800ms var(--out) both}
@keyframes up{from{transform:translateY(190px)}}
@keyframes lift{from{transform:translateY(110%)}}
@keyframes nudge{from{opacity:0;transform:translate(-6px,6px)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
 .draw,.rise,.up,.lift,.nudge{animation-name:fade;animation-duration:400ms}}
</style><rect width="840" height="420" fill="#0D1117"/><rect x="32" y="32" width="776" height="1" fill="#30363D" class="draw" style="animation-delay:0ms"/><text x="32" y="64" font-size="13" font-weight="700" class="a rise" style="animation-delay:160ms">01</text><text x="98" y="64" font-size="13" font-weight="700" class="rise" style="animation-delay:220ms">Profile</text><text x="808" y="64" font-size="13" font-weight="400" class="m rise" text-anchor="end" style="animation-delay:280ms">About</text><clipPath id="p0"><rect x="0" y="93.5" width="840" height="37.5"/></clipPath><g clip-path="url(#p0)"><text x="230" y="122" font-size="30" font-weight="500" class="lift" letter-spacing="-0.6" style="animation-delay:320ms">I build software that scales</text></g><clipPath id="p1"><rect x="0" y="133.5" width="840" height="37.5"/></clipPath><g clip-path="url(#p1)"><text x="230" y="162" font-size="30" font-weight="500" class="lift" letter-spacing="-0.6" style="animation-delay:390ms">quietly and feels considered —</text></g><clipPath id="p2"><rect x="0" y="173.5" width="840" height="37.5"/></clipPath><g clip-path="url(#p2)"><text x="230" y="202" font-size="30" font-weight="500" class="m lift" letter-spacing="-0.6" style="animation-delay:460ms">clean architecture underneath,</text></g><clipPath id="p3"><rect x="0" y="213.5" width="840" height="37.5"/></clipPath><g clip-path="url(#p3)"><text x="230" y="242" font-size="30" font-weight="500" class="m lift" letter-spacing="-0.6" style="animation-delay:530ms">a polished experience on top.</text></g><rect x="230" y="300" width="578" height="1" fill="#30363D" class="draw" style="animation-delay:560ms"/><text x="230" y="330" font-size="13" font-weight="400" class="m rise" style="animation-delay:760ms">Focus</text><text x="230" y="356" font-size="15" font-weight="400" class="rise" style="animation-delay:820ms">Full-stack web</text><text x="230" y="377" font-size="15" font-weight="400" class="rise" style="animation-delay:860ms">&amp; AI integration</text><text x="428" y="330" font-size="13" font-weight="400" class="m rise" style="animation-delay:820ms">Method</text><text x="428" y="356" font-size="15" font-weight="400" class="rise" style="animation-delay:880ms">Clean architecture,</text><text x="428" y="377" font-size="15" font-weight="400" class="rise" style="animation-delay:920ms">typed end to end</text><text x="626" y="330" font-size="13" font-weight="400" class="m rise" style="animation-delay:880ms">Range</text><text x="626" y="356" font-size="15" font-weight="400" class="rise" style="animation-delay:940ms">Web, mobile, desktop,</text><text x="626" y="377" font-size="15" font-weight="400" class="rise" style="animation-delay:980ms">real-time systems</text></svg>
