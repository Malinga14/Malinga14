<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-label="01 Profile. I build software that scales quietly and feels considered — clean architecture underneath, a polished experience on top."><title>01 Profile. I build software that scales quietly and feels considered — clean architecture underneath, a polished experience on top.</title><style>
:root{--out:cubic-bezier(0.23,1,0.32,1);--io:cubic-bezier(0.77,0,0.175,1)}
text{font-family:'Helvetica Neue', Helvetica, Arial, Inter, system-ui, sans-serif;fill:#E6EDF3;font-kerning:normal}
.m{fill:#7D8590}.a{fill:#FF4F2B}
.draw{transform-box:fill-box;transform-origin:left center;animation:draw 1100ms var(--io) both}
.rise{animation:rise 700ms var(--out) both}
.up{animation:up 1000ms var(--out) both}
@keyframes draw{from{transform:scaleX(0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes up{from{transform:translateY(190px)}}
</style><rect width="840" height="420" fill="#0D1117"/><rect x="32" y="32" width="776" height="1" fill="#30363D"/><text x="32" y="64" font-size="13" font-weight="700" class="a">01</text><text x="98" y="64" font-size="13" font-weight="700">Profile</text><text x="808" y="64" font-size="13" font-weight="400" class="m" text-anchor="end">About</text><text x="230" y="122" font-size="30" font-weight="500" letter-spacing="-0.6">I build software that scales</text><text x="230" y="162" font-size="30" font-weight="500" letter-spacing="-0.6">quietly and feels considered —</text><text x="230" y="202" font-size="30" font-weight="500" class="m" letter-spacing="-0.6">clean architecture underneath,</text><text x="230" y="242" font-size="30" font-weight="500" class="m" letter-spacing="-0.6">a polished experience on top.</text><rect x="230" y="300" width="578" height="1" fill="#30363D"/><text x="230" y="330" font-size="13" font-weight="400" class="m">Focus</text><text x="230" y="356" font-size="15" font-weight="400">Full-stack web</text><text x="230" y="377" font-size="15" font-weight="400">&amp; AI integration</text><text x="428" y="330" font-size="13" font-weight="400" class="m">Method</text><text x="428" y="356" font-size="15" font-weight="400">Clean architecture,</text><text x="428" y="377" font-size="15" font-weight="400">typed end to end</text><text x="626" y="330" font-size="13" font-weight="400" class="m">Range</text><text x="626" y="356" font-size="15" font-weight="400">Web, mobile, desktop,</text><text x="626" y="377" font-size="15" font-weight="400">real-time systems</text></svg>
